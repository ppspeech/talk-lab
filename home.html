<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speech practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff6e9;font-family:Lexend,system-ui,sans-serif;color:#2a2116}
.in{max-width:520px;margin:0 auto;padding:20px 16px 32px;display:flex;flex-direction:column;gap:14px}
h1{font-family:Fredoka,sans-serif;font-size:28px;margin:0;line-height:1.15}.sub{font-size:13px;color:#7a6c5a}
.box{border-radius:18px;padding:12px 14px}.b1{background:#f6dfd3}.b2{background:#dde9d9}.b3{background:#e4def0}.b4{background:#f4e7c4}
.eb{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6a5c4a;margin-bottom:8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.d{background:#fff;border:0;border-radius:12px;text-align:center;padding:6px 0;font:600 12px Lexend,sans-serif;color:#2a2116;cursor:pointer}
.d i{display:block;font-style:normal;font-size:22px;line-height:1.3}.d.on{background:#0f6e56;color:#fff}.d.today{outline:2px solid #b5543a}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.c{background:#fff;border:0;border-radius:14px;text-align:center;padding:8px 4px;font:600 18px Fredoka,sans-serif;color:#2a2116;cursor:pointer;position:relative}
.c span{display:block;font-size:30px;line-height:1.2}.c.done{outline:3px solid #0f6e56}.c.done::after{content:"✓";position:absolute;top:4px;right:8px;color:#0f6e56;font-size:14px}
.mm{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;font-size:13px;line-height:1.45}.mm+.mm{margin-top:10px}
.mm img{width:100px;height:auto;background:#faf3df;border-radius:10px}.mm b{font-size:15px;display:block;margin-bottom:2px}
.note{font-size:14px;line-height:1.5;white-space:pre-wrap}
ul{margin:0;padding-left:18px;font-size:13px;line-height:1.5}
.btn{border:0;border-radius:999px;padding:13px;font:600 15px Lexend,sans-serif;background:#b5543a;color:#fff;width:100%;cursor:pointer}
.small{font-size:12px;color:#7a6c5a;text-align:center}
.cheer{font-family:Fredoka,sans-serif;font-size:15px;margin-top:6px}
.empty{padding:40px 10px;text-align:center}
</style></head><body><main class="in" id="app"></main>

const MM_PL={lips:["👄","Lips together","Squash your lips shut, then let go"],lipteeth:["🦷","Top teeth on bottom lip","Gently bite your bottom lip and blow"],teeth:["👅","Tongue peeks out","Tongue between your teeth"],tip:["☝️","Tongue tip up","Tip taps the bumpy bit behind your top teeth"],smile:["😁","Smile, teeth together","Tongue tucked behind the teeth"],round:["🎺","Trumpet lips","Push your lips out, teeth close together"],oo:["😗","Round lips","Small round lips, like saying oo"],back:["🔙","Back of tongue up","Back of your tongue bumps the roof"],open:["😮","Mouth open, relaxed","Nothing touches"]};
const MM_AIR={puff:["💨","Big puff of air","The feather jumps!"],soft:["🍃","Little puff","Feather hardly moves"],stream:["🌬️","Long stream of air","Keep it going…"],nose:["👃","Air out your nose","Pinch your nose: it stops!"],breath:["😮‍💨","Breathy air","Fog up a mirror"],side:["↔️","Air round the sides","Tongue up, air slips past the sides"]};

const TIPS=[["Little and often","5 to 7 minutes a day, same place, same time. Keep it short and end on a win."],["Lots of tries","Short bursts with many repeats help more than one long session."],["Praise every try","Respond to every attempt, then say the word back once, clearly."],["Keep it fun","Change the game, keep the words. Follow your child's interests."]];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function dec(h){ try{ h=h.replace(/^#/,"").replace(/-/g,"+").replace(/_/g,"/"); return JSON.parse(decodeURIComponent(escape(atob(h)))); }catch(e){ return null; } }
const D=dec(location.hash), KEY="tl-home-"+(location.hash||"").slice(1,60);
let st={days:[],done:[]}; try{ st=Object.assign(st,JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} };
function monday(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function render(){
  const app=document.getElementById("app");
  if(!D){ app.innerHTML=`<div class="empty"><h1>Speech practice</h1><p>This link looks incomplete. Ask your speech pathologist to send it again.</p></div>`; return; }
  document.title=`${D.n||"Speech"} practice`;
  const start=monday(D.d||Date.now()), todayIdx=Math.floor((new Date().setHours(0,0,0,0)-start)/864e5);
  const nd=st.days.length;
  const cheer= nd>=5?"Amazing week! 🌟": nd>=3?"Great work, keep going! 💪": nd>=1?"Nice start! 🎉":"Tap today's day when you've practised.";
  const sounds=(D.k||[]).filter(k=>MM[k]);
  app.innerHTML=`
  <div><h1>${esc(D.n)}'s speech practice 🚀</h1><div class="sub">From ${esc(D.c||"your speech pathologist")} · week of ${start.toLocaleDateString("en-AU",{day:"numeric",month:"short"})}</div></div>
  <section class="box b4"><div class="eb">This week</div><div class="days">${["M","T","W","T","F","S","S"].map((l,i)=>`<button class="d ${st.days.includes(i)?"on":""} ${i===todayIdx?"today":""}" data-day="${i}" aria-pressed="${st.days.includes(i)}"><i>${st.days.includes(i)?"⭐":"○"}</i>${l}</button>`).join("")}</div><div class="cheer">${cheer}</div></section>
  ${(D.w||[]).length?`<section class="box b2"><div class="eb">Practice words · tap each one after you say it</div><div class="cards">${D.w.map(([w,e])=>`<button class="c ${st.done.includes(w)?"done":""}" data-w="${esc(w)}" aria-pressed="${st.done.includes(w)}"><span>${e||"✏️"}</span>${esc(w)}</button>`).join("")}</div></section>`:""}
  ${sounds.length?`<section class="box b1"><div class="eb">How to make the sound</div>${sounds.map(k=>{ const s=MM[k],P=MM_PL[s.place],A=MM_AIR[s.air];
    return `<div class="mm"><img src="${MM_IMG[s.place]}" alt="Mouth shape for ${esc(k)}"><div><b>/${esc(k)}/ · the ${esc(s.cue)}</b>${P[0]} ${esc(P[1])}: ${esc(P[2].charAt(0).toLowerCase()+P[2].slice(1))}<br>${s.voice?"🐝 Voice on: hand on throat, feel the buzz":"🤫 Voice off: whisper it, no buzz"}<br>${A[0]} ${esc(A[1])}</div></div>`; }).join("")}</section>`:""}
  ${D.t?`<section class="box b3"><div class="eb">Note from ${esc(D.c||"your speech pathologist")}</div><div class="note">${esc(D.t)}</div></section>`:""}
  <section class="box" style="background:#fff"><div class="eb">Tips for home</div><ul>${TIPS.map(([h,b])=>`<li><b>${h}:</b> ${b}</li>`).join("")}</ul></section>
  <button class="btn" id="send">Send ${esc(D.c||"us")} an update 💬</button>
  <div class="small">Your ticks stay on this phone. Nothing is uploaded.</div>`;
}
function msg(){ const nd=st.days.length; return `${D.n} practised ${nd} day${nd===1?"":"s"} this week.`+(st.done.length?` Words done: ${st.done.join(", ")}.`:""); }
document.addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.day!=null){ const i=+b.dataset.day; st.days=st.days.includes(i)?st.days.filter(x=>x!==i):[...st.days,i]; save(); render(); return; }
  if(b.dataset.w!=null){ const w=b.dataset.w; st.done=st.done.includes(w)?st.done.filter(x=>x!==w):[...st.done,w]; save(); render(); return; }
  if(b.id==="send"){ const t=msg();
    if(navigator.share){ try{ await navigator.share({text:t}); return; }catch(err){ if(err&&err.name==="AbortError") return; } }
    location.href = D.e ? `mailto:${encodeURIComponent(D.e)}?subject=${encodeURIComponent("Speech practice update")}&body=${encodeURIComponent(t)}` : `sms:?&body=${encodeURIComponent(t)}`; }
});
window.addEventListener("hashchange",()=>location.reload());
render();
</script></body></html>
