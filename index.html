<style>
/* Layout: app bar + tabs over a single 960px working column; NDP3 stages drawn as a bottom-up brick wall */
:root{
  --bg:#f4ede1; --surface:#fffcf6; --surface-2:#f8f1e4; --ink:#2b2420; --muted:#7f7062; --line:#e8dcc8;
  --accent:#b5543a; --accent-ink:#ffffff; --accent-soft:#f6dfd3;
  --ok:#2c8a4b; --ok-soft:#e1f2e6; --err:#c0453c; --err-soft:#f8e3e1; --warn:#a8711a; --warn-soft:#f7ecd6;
  --g1:#0d6a6e; --g2:#b2543a; --g3:#5a54a8; --g4:#8a7a12;
  --brick:#e5ddd3; --brick-line:#cfc4b6;
  --f-display:"Lexend",system-ui,sans-serif; --f-head:"Fraunces","Georgia",serif; --f-body:"Atkinson Hyperlegible",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --surface:#172225; --surface-2:#1c292d; --ink:#e3ecec; --muted:#93a5aa; --line:#2b3b3f;
  --accent:#4fb8b8; --accent-ink:#06191a; --accent-soft:#163a3b;
  --ok:#5cc47e; --ok-soft:#173523; --err:#ef7a70; --err-soft:#3d1c19; --warn:#e0a94a; --warn-soft:#3a2c12;
  --g1:#4fb8b8; --g2:#e98d6f; --g3:#a29cf0; --g4:#d4c24c;
  --brick:#2a3436; --brick-line:#3a4749; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#172225; --surface-2:#1c292d; --ink:#e3ecec; --muted:#93a5aa; --line:#2b3b3f;
  --accent:#4fb8b8; --accent-ink:#06191a; --accent-soft:#163a3b;
  --ok:#5cc47e; --ok-soft:#173523; --err:#ef7a70; --err-soft:#3d1c19; --warn:#e0a94a; --warn-soft:#3a2c12;
  --g1:#4fb8b8; --g2:#e98d6f; --g3:#a29cf0; --g4:#d4c24c;
  --brick:#2a3436; --brick-line:#3a4749; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;font-weight:600}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-head);font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.who{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.who .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0;margin-bottom:-1px}
.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);font-family:var(--f-display);font-weight:500;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-h h2{font-size:18px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
input[type=text],input[type=date],select,textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.err{background:var(--err-soft);color:var(--err)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.gdot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
/* clients */
.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ccard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.ccard:hover{border-color:var(--accent)}
.ccard .n{font-family:var(--f-display);font-weight:600;font-size:16px}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
/* wall */
.wall{display:flex;flex-direction:column-reverse;gap:4px}
.course{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:stretch}
.course .lab{font-family:var(--f-display);font-size:12px;font-weight:600;background:var(--brick);border:1px solid var(--brick-line);border-radius:4px;padding:6px 8px;display:flex;flex-direction:column;justify-content:center;line-height:1.2}
.course .lab span{font-weight:400;color:var(--muted);font-size:11px}
.course .slots{background:repeating-linear-gradient(90deg,var(--brick) 0 70px,var(--brick-line) 70px 72px);border:1px solid var(--brick-line);border-radius:4px;padding:5px;display:flex;gap:6px;flex-wrap:wrap;min-height:36px;align-items:center}
.course:nth-child(even) .slots{background-position:36px 0}
.course .slots .chip{background:var(--surface);border:1px solid var(--line)}
/* checklist */
details.stage{border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
details.stage summary{cursor:pointer;padding:10px 12px;font-family:var(--f-display);font-weight:600;display:flex;justify-content:space-between;gap:8px}
details.stage summary::-webkit-details-marker{display:none}
.checks{display:flex;flex-direction:column;gap:2px;padding:0 12px 12px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;border-radius:6px;cursor:pointer}
.checks label:hover{background:var(--surface)}
.checks input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
/* goals */
.goal{border:1px solid var(--line);border-left:5px solid var(--gc);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface);min-width:0}
.goal-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.goal-h h3{font-size:16px;flex:1;min-width:0}
.stims{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stim-in{position:relative}
.stim-cell{display:flex;flex-direction:column;gap:4px;min-width:0}
.pbars{display:flex;flex-direction:column;gap:6px}
.savepill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.savepill.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.savepill.bad{background:var(--err-soft);color:var(--err);border-color:var(--err)}
.nextp{border-color:var(--accent)}
.nsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.nsbox{display:flex;flex-direction:column;gap:2px;background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.nsbox strong{font-family:var(--f-display);font-size:17px}
.nsgoals{display:flex;flex-direction:column;gap:8px}
.nsgoal{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;flex-wrap:wrap}
.nsgoal>div{flex:1;min-width:200px}
.tgts{display:flex;flex-wrap:wrap;gap:6px}
.tgt{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;background:var(--surface);text-align:left}
.tgt.no{border-color:var(--err);background:var(--err-soft)} .tgt.em{border-color:var(--warn);background:var(--warn-soft)}
.tgt .sym{font-size:18px;line-height:1.1} .tgt:disabled{cursor:not-allowed;opacity:.6}
.tiny{font-size:10px}
.tlist{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:28px minmax(90px,140px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 4px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow.good .tword{color:var(--ok)} .trow.nt{opacity:.55}
.tnum{color:var(--muted);font-weight:700;text-align:right}
.tword{font-weight:700;display:flex;flex-direction:column;line-height:1.2;overflow-wrap:anywhere}
.said{font-weight:400;font-size:13px;color:var(--err)}
.tiles{display:flex;flex-wrap:wrap;gap:4px}
.tile{position:relative;min-width:38px;height:40px;padding:0 6px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-size:18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.tile.v{background:var(--surface-2);font-weight:400}
.tile.add{border-style:dashed;border-color:var(--warn);background:var(--warn-soft);color:var(--warn);font-size:15px}
.tile.plus{border-style:dashed;color:var(--muted);font-weight:400;min-width:30px;background:none}
.tpop.ins{border-color:var(--warn)}
.tile.err{border-color:var(--err);background:var(--err-soft);color:var(--err)}
.tile.sel{outline:3px solid var(--accent);outline-offset:1px}
.tile small{position:absolute;right:2px;bottom:0;font-size:11px;line-height:1;font-weight:700}
.tact{display:flex;gap:4px}
.tok,.tnt{height:40px;min-width:40px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:700}
.tok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tnt[aria-pressed="true"]{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.tnt{font-size:12px}
.tpop{grid-column:1/-1;border:1px solid var(--accent);border-radius:8px;padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.tsubs{display:flex;flex-wrap:wrap;gap:4px}
.tsub{min-width:40px;height:38px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);cursor:pointer;font-size:16px}
.tsub.ok{color:var(--ok);font-weight:700;font-size:13px} .tsub:not(.ipa){font-size:13px;font-weight:700}
.tsub.on{background:var(--err);color:var(--surface);border-color:var(--err)}
.detp{display:flex;flex-wrap:wrap;gap:6px}
.evid{background:var(--warn-soft);border-radius:6px;padding:6px 10px}
@media (max-width:560px){.trow{grid-template-columns:22px minmax(0,1fr) auto;grid-template-areas:"n w a" "t t t"}.tnum{grid-area:n}.tword{grid-area:w}.tact{grid-area:a}.tiles{grid-area:t}}
.gm-balloon{background:linear-gradient(180deg,#bfe9ff,#e8f7ff 70%,#d6f3d0)}
.gm-dig{background:linear-gradient(180deg,#8fd8f5 0 22%,#f6dc9c 22%,#e9c477)}
.gm-burger{background:linear-gradient(160deg,#fff3d6,#ffd08a)}
.gm-tank{background:linear-gradient(180deg,#bdeaff,#5cc0ea)}
.bal{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 8px;width:100%;max-width:620px}
.bln{position:relative;height:96px;border:0;background:none;padding:0;cursor:pointer}
.bln .bb{position:absolute;left:50%;top:0;width:62px;height:76px;margin-left:-31px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.65) 0 10%,transparent 11%),var(--c);box-shadow:inset -6px -8px 0 rgba(0,0,0,.12)}
.bln .bs{position:absolute;left:50%;top:74px;width:2px;height:22px;background:#9a8f84}
.bln .bb::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-5px;border:5px solid transparent;border-bottom-color:var(--c);transform:rotate(180deg)}
.bln.pop{cursor:default}
.bln .bp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;height:92px;background:#fff;border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.12);border:3px solid #ffd9e6;position:relative;font-family:"Fredoka",sans-serif}
.bln .bp i{font-style:normal;font-size:34px;line-height:1.1}.bln .bp b{font-size:16px;color:#2b2140;line-height:1.1;overflow-wrap:anywhere;padding:0 4px}
.bln .bp.star{border-color:#f2a516;background:#fff8e6}.bln .bp.nope{border-color:#d7dfde;opacity:.75}
.bln .bp em{position:absolute;top:-10px;right:-6px;font-style:normal;color:#f2a516;font-size:22px}
.bln.last .bp{transform:scale(1.08);box-shadow:0 0 0 4px #ffcf33,0 4px 0 rgba(0,0,0,.12)}
.gm-wait{font-size:clamp(26px,4.5vw,44px);color:#6a47e8}
.mface.nopic{font-size:clamp(14px,2.4vw,22px)}
.gm-balloon .ghint,.gm-tank .ghint{color:#8a2453;text-shadow:none}.gm-dig .ghint{color:#5a3a00;text-shadow:none}
@media (prefers-reduced-motion:no-preference){.bln:not(.pop) .bb{animation:bfloat 3s ease-in-out var(--d) infinite}.bln .bp{animation:gmpop .4s cubic-bezier(.2,1.6,.4,1)}}
@keyframes bfloat{50%{translate:0 -7px}}
.bln:disabled:not(.pop){opacity:.65;cursor:default}
.dig{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:520px}
.dg{aspect-ratio:1;border-radius:14px;border:0;background:#e6b95f;box-shadow:inset 0 -6px 0 #c9963c,0 3px 0 rgba(0,0,0,.12);font-size:34px;cursor:pointer;position:relative}
.dg::before{content:"";position:absolute;inset:22% 22%;border-radius:50%;background:radial-gradient(#f0cc7e 30%,transparent 31%) 0 0/12px 12px;opacity:.6}
.dg.dug{background:#8b6a3a;box-shadow:inset 0 6px 0 #6b4f28;cursor:default}.dg.dug::before{display:none}
.dg.warm{box-shadow:inset 0 -6px 0 #c9963c,0 0 0 4px #ffcf33,0 0 18px #ffcf33}
.dg:disabled:not(.dug){cursor:default;opacity:.8}
.bgr{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.bstack{display:flex;flex-direction:column;align-items:center;min-height:200px;justify-content:flex-end}
.bstack .lay{font-size:58px;line-height:.6}
.bstack .bun{font-size:56px;line-height:.8}.bstack .bun.ghost{opacity:.25}
.bun2{display:block;width:124px;background:#e9a65a;position:relative;box-shadow:inset 0 -6px 0 #cf8a3f}
.bun2.top{height:54px;border-radius:62px 62px 12px 12px;margin-bottom:4px}
.bun2.top.ghost{opacity:.22}
.bun2.bot{height:30px;border-radius:8px 8px 22px 22px;margin-top:6px;box-shadow:inset 0 6px 0 #f3c48a}
.bun2 i{position:absolute;width:9px;height:5px;border-radius:50%;background:#fff3d6;transform:rotate(-20deg)}
.bun2 i:nth-child(1){left:30px;top:14px}.bun2 i:nth-child(2){left:58px;top:9px;transform:rotate(15deg)}.bun2 i:nth-child(3){left:86px;top:16px}.bun2 i:nth-child(4){left:44px;top:28px;transform:rotate(25deg)}.bun2 i:nth-child(5){left:74px;top:27px}
@media (prefers-reduced-motion:no-preference){.bstack .lay:first-of-type{animation:drop .35s cubic-bezier(.2,1.6,.4,1)}}
@keyframes drop{from{transform:translateY(-60px);opacity:0}}
.tank{position:relative;width:100%;max-width:640px;height:260px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.05)),linear-gradient(180deg,#7fd3f7,#2a8fc4);border:6px solid #ffffffaa;overflow:hidden}
.fishy{position:absolute;top:var(--y);left:var(--x);font-size:34px}
@media (prefers-reduced-motion:no-preference){.fishy{animation:swim var(--d) ease-in-out var(--dl) infinite alternate}}
@keyframes swim{from{transform:translateX(-20px)}to{transform:translateX(40px)}}
.weed{position:absolute;bottom:-4px;font-size:40px}
.tempty{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-family:"Fredoka",sans-serif;font-size:18px;font-weight:600;text-align:center;padding:20px}
@media (max-width:640px){.bal{grid-template-columns:repeat(4,1fr)}.bln{height:84px}.bln .bb{width:52px;height:64px;margin-left:-26px}.bln .bs{top:62px}.dg{font-size:24px}.tank{height:200px}}
.gpick{background:#fdf3dc;padding:16px;display:flex;flex-direction:column;gap:12px;font-family:"Fredoka","Lexend",system-ui,sans-serif;color:#2b2140}
.gpick-h{display:flex;justify-content:space-between;align-items:center}.gpick-h b{font-size:22px}
.gpick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.gcard{position:relative;background:#fff;border-radius:20px;border:2.5px solid #d6d0c6;box-shadow:0 5px 0 #c9c1b4;padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;cursor:pointer;font-family:inherit;color:inherit}
.gcard:hover{transform:translateY(-2px)}.gcard:active{transform:translateY(3px);box-shadow:0 2px 0 #c9c1b4}
.gart{width:100%;aspect-ratio:16/10;border-radius:14px;display:grid;place-items:center;font-size:58px}

.stat{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-size:13px;line-height:1.3;white-space:nowrap}

.gfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;padding-top:8px;border-top:1px solid var(--line)}

}
/* summary */
.sumgoal{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line)}
.sumgoal:first-child{border-top:0}
/* history */
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:480px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.sheet .words{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sheet .words span{border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-family:var(--f-display);font-size:18px;font-weight:600}

  const phrase=raw.includes("_"); const ph=raw.filter(c=>c!=="_").map(c=>CODE[c]||c);
  let sh=ph.map(p=>VSET.has(p)?"V":"C").join(""); const syl=(sh.match(/V/g)||[]).length;
  if(phrase) sh="Phrase"; else if(syl>=3) sh="3+ syllables";
  return {w:w.trim(), ph, shape:sh};
}).filter(b=>!_seen.has(b.w) && _seen.add(b.w));
const BANK_BY_WORD=Object.fromEntries(BANK.map(b=>[b.w,b]));
const ALL_SHAPES=[...new Set([...SHAPES.filter(s=>s!=="Phrase"), ...BANK.map(b=>b.shape).filter(s=>s!=="Phrase"), "Phrase"])];
/* Position is word-based: initial = before the first vowel (so the /l/ in "blue" is initial), final = after the last vowel. */
function posOf(ph,i){
  const v=ph.map((p,j)=>VSET.has(p)?j:-1).filter(j=>j>=0);
  if(!v.length) return "I";
  return i<v[0]?"I": i>v[v.length-1]?"F":"M";
}
/* Is the consonant at i next to another consonant in the same cluster? */
const inCluster=(ph,i)=>!VSET.has(ph[i]) && ((i>0&&!VSET.has(ph[i-1])) || (i<ph.length-1&&!VSET.has(ph[i+1])));
/* Blend targets: "#l" l-blends, "#r" r-blends, "#s" s-blends, "#w" w-blends (word-initial) */
const BLENDS={"#l":{ph:"l",name:"l-blends",ex:"blue, play, slide"},"#r":{ph:"ɹ",name:"r-blends",ex:"tree, frog, bread"},"#s":{ph:"s",name:"s-blends",ex:"spoon, star, snail"},"#w":{ph:"w",name:"w-blends",ex:"swing, sweep, swim"}};
const targetPh=snd=>BLENDS[snd]?.ph||snd;
const soundName=snd=>BLENDS[snd]?BLENDS[snd].name:`/${snd}/`;
function matchesBlend(ph,snd){
  const b=BLENDS[snd], v0=ph.findIndex(p=>VSET.has(p)); const onset=ph.slice(0,v0<0?ph.length:v0);
  if(onset.length<2) return false;
  if(snd==="#s") return onset[0]==="s";
  return onset.slice(1).includes(b.ph);
}
function bankMatches(f, allowed){
  return BANK.filter(b=>{
    if(f.shape && b.shape!==f.shape) return false;
    if(f.sound && BLENDS[f.sound]){
      if(!matchesBlend(b.ph,f.sound)) return false;
    } else if(f.sound){
      const idx=b.ph.map((p,i)=>p===f.sound?i:-1).filter(i=>i>=0);
      if(!idx.length) return false;
      const ok=idx.filter(i=>(!f.pos||posOf(b.ph,i)===f.pos) && (!f.ctx || (f.ctx==="cl")===inCluster(b.ph,i)));
      if(!ok.length) return false;
    }
    if(allowed && !b.ph.every(p=>VSET.has(p)||p===targetPh(f.sound)||allowed.has(p))) return false;
    return true;
  }).sort((a,b)=>a.ph.length-b.ph.length || a.w.localeCompare(b.w));
}
function shapeOf(g,i){ const w=(g.stimuli[i]||"").trim().toLowerCase(); return (g.shapes&&g.shapes[i]) || BANK_BY_WORD[w]?.shape || guessShape(w); }

/* ---------- storage adapter ---------- */
const store = {
  path(cid){ return "data/users/"+S.uid+"/"+cid; },
  async saveClient(c){
    const {id, ...body} = c;
    if(S.mode==="db") return S.db.doc(this.path(id)).set(body);
    S.mem.clients[id]=clone(c); memRefresh();
  },
  async deleteClient(id){
    if(S.mode==="db"){
      const col=S.db.doc(this.path(id)).collection("sessions");
      const snap=await col.get();
      for(const d of snap.docs) await col.doc(d.id).delete();
      return S.db.doc(this.path(id)).delete();
    }
    delete S.mem.clients[id]; delete S.mem.sessions[id]; memRefresh();
  },
  async addSession(cid, s){
    const {id, ...body}=s;
    if(S.mode==="db") return S.db.doc(this.path(cid)).collection("sessions").doc(id).set(body);
    (S.mem.sessions[cid] ||= {})[id]=clone(s); memSessions();
  },
  async deleteSession(cid, sid){
    if(S.mode==="db") return S.db.doc(this.path(cid)).collection("sessions").doc(sid).delete();
    delete (S.mem.sessions[cid]||{})[sid]; memSessions();
  },
  watchSessions(cid){
    if(S.unsubSessions){ S.unsubSessions(); S.unsubSessions=null; }

function syncClient(){
  if(!S.clientId) return;
  const fresh=S.clients.find(c=>c.id===S.clientId);

  if(!S.dirty) S.client=normClient(clone(fresh));
}
const NSTIM=10;
const pad=(a,v)=>{ a=Array.isArray(a)?a.slice(0,NSTIM):[]; while(a.length<NSTIM) a.push(v); return a; };
function normClient(c){
  if(c.pmv && Object.keys(c.pmv).length && !c.pmvHistory?.length){ c.pmvDate=c.pmvUpdated||today(); c.pmvHistory=[{date:c.pmvDate, pmv:clone(c.pmv), vowels:clone(c.vowels||{})}]; }
  (c.goals||[]).forEach(g=>{
    g.stimuli=pad(g.stimuli,""); g.reint=pad(g.reint,false); g.shapes=pad(g.shapes,"");
    g.cues=[...new Set((g.cues||[]).map(x=>/NDP3 picture|Articulogram/i.test(x)?"Picture cues":x))];
    g.filter=g.filter||{sound:"",pos:"",shape:"",only:false};
  });
  return c;
}
const softFor=g=>Math.max(3,Math.round(40/Math.max(1,g.stimuli.filter(w=>w.trim()).length)));

/* ---------- saving the plan ---------- */
function scheduleSave(){
  S.dirty=true; setStatus("Saving…");
  clearTimeout(S.saveTimer);
  S.saveTimer=setTimeout(flushSave,700);
}
function flushSave(){
  S.saveTimer=null;
  const c=clone(S.client); c.updated=Date.now();
  S.saveQ = S.saveQ.then(()=>store.saveClient(c)).then(()=>{
    if(!S.saveTimer){ S.dirty=false; setStatus(S.mode==="db"?"Saved":"Not saved (offline)"); }
  }).catch(e=>{ S.dirty=false; setStatus("Not saved"); toast(e?.code==="quota_exceeded"?"Storage is full. Delete old clients to free space.":"Couldn't save. Check your connection and try again."); });
}

  stimuli:pad([],""), shapes:pad([],""), cues:["Picture cues"], reint:pad([],false), active:true}; }
/* goal builder helpers */
function allowedSet(){
  const pm=S.client.pmv||{}; const ks=Object.keys(pm).filter(k=>Object.values(pm[k]).some(v=>v==="yes"||v==="em"));
  return ks.length ? new Set(ks) : null;
}
function suggestFor(g){ const f=g.filter||{}; return bankMatches(f, f.only?allowedSet():null); }
function autoLabel(f){
  if(!f.sound && !f.shape) return "";
  const pos={I:"initial",M:"medial",F:"final"}[f.pos]||"";
  const ctx=BLENDS[f.sound]?"":({si:"singleton",cl:"in clusters"}[f.ctx]||"");
  return [f.sound?`${soundName(f.sound)}${pos&&!BLENDS[f.sound]?" "+pos:""}${ctx?" "+ctx:""}`:"", f.shape].filter(Boolean).join(" · ");
}
const EARLY="up eat egg arm ice owl ape oat out in on eight ears eyes aim add ache itch off oak oil app edge us all pie pea bee bye moo two tea toe key car go shoe zoo saw sea knee no door four boy bow hay my cow me baby mummy daddy puppy bunny teddy money honey tummy cookie pony tutu hippo kitty coffee sofa tiger water yoyo potty cat dog pig bus cup hat bed sun map fish book moon boat cake duck pen mop net bat nut ball house kite".split(" ");
function refillGoal(g){
  const all=suggestFor(g).map(b=>b.w), rk=w=>{ const i=EARLY.indexOf(w); return (picOf(w)?0:2000)+(i<0?1000:i); }; const sug=all.slice().sort((a,b)=>rk(a)-rk(b));
  g.stimuli=pad(sug.slice(0,NSTIM),""); g.shapes=pad([],""); g.reint=pad([],false); g.autoFill=true;
}
function onFilterChange(g){
  if(g.targetAuto!==false) g.target=autoLabel(g.filter);
  if(g.filter.sound && !g.stageSet) g.stage = BLENDS[g.filter.sound] ? 3 : VSET.has(g.filter.sound) ? 1 : Math.max(1, ndpStageOf(g.filter.sound));
  if(g.autoFill!==false) refillGoal(g);
}

/* ---------- live session ---------- */
const liveKey = cid => "ndp3-live-"+cid;
function ensureLive(){
  if(S.live && S.live.cid===S.clientId) return S.live;
  S.live = lsGet(liveKey(S.clientId)) || {cid:S.clientId, date:today(), notes:"", goals:{}};
  return S.live;
}
function liveGoal(g){
  const L=ensureLive();
  if(!L.goals[g.id]) L.goals[g.id]={prompt:"Direct model", trials:Array.from({length:NSTIM},()=>[])};
  return L.goals[g.id];
}
function saveLive(){ if(S.live) lsSet(liveKey(S.live.cid), S.live); }
function sessionGoals(){ return (S.client?.goals||[]).filter(g=>g.active && g.stimuli.some(w=>w.trim())); }

function summarise(){
  const L=ensureLive(); let tc=0, tt=0;
  const goals = sessionGoals().map(g=>{
    const lg=lgFix(g);
    const stim = g.stimuli.map((w,i)=>({word:w.trim(), shape:shapeOf(g,i), trials:[...(lg.trials[i]||[])]})).filter(s=>s.word);
    const c=stim.reduce((a,s)=>a+s.trials.filter(x=>x).length,0), t=stim.reduce((a,s)=>a+s.trials.length,0);
    tc+=c; tt+=t;
    const allHit = stim.every(s=>s.trials.length && pct(s.trials.filter(x=>x).length, s.trials.length)>=90);
    const acc=pct(c,t);
    let step = "no";
    if(t && acc>=90 && allHit) step = lg.cue>=4 ? "ready" : "fade";
    const reint = g.stimuli.map((w,i)=> w.trim() ? (lg.trials[i]||[]).filter(x=>!x).length>=2 : false);
    return {id:g.id, target:g.target||"Untitled goal", stage:g.stage, prompt:CUE2PROMPT[lg.cue], cueName:CUE_LADDER[lg.cue][0], cueStats:cueStats(lg), modStats:modStats(lg), near:(lg.log||[]).filter(e=>e.near).length, sx:stratStats(lg), stimuli:stim, correct:c, total:t, acc, step, reint};
  });
  return {goals, totalCorrect:tc, totalTrials:tt, acc:pct(tc,tt), date:L.date, notes:L.notes};
}

async function saveSession(){
  const sum=summarise();
  if(!sum.totalTrials){ toast("No trials logged yet."); return; }
  const rec={id:"s"+Date.now().toString(36), savedAt:new Date().toISOString(), ...sum};
  try{
    await store.addSession(S.clientId, rec);
  }catch(e){ toast(e?.code==="quota_exceeded"?"Storage is full. Delete old sessions to free space.":"Couldn't save the session. Your taps are kept; try again."); return; }
  S.client.goals.forEach(g=>{ const r=rec.goals.find(x=>x.id===g.id); if(r) g.reint=r.reint; });
  S.client.lastSession=rec.date;
  scheduleSave();
  lsSet(liveKey(S.clientId), null); S.live=null; S.finishing=false; S.saved=rec;
  renderMain(); window.scrollTo({top:0});
  toast("Session saved");
}

const QSETS=[["VC","up, eat"],["CV","bee, car"],["CVCV","puppy"],["CVC","cat, dog"]];
function goalBuilder(g,gi){

      <div>${rows}</div>
      <div class="gfoot"><span><strong class="big" style="font-size:18px">${sg.acc==null?"–":sg.acc+"%"}</strong> <span class="muted">${sg.correct}/${sg.total} · goal accuracy</span></span>${stepChip(sg)}</div>

function stepChip(g){

}

      <div><strong>${esc(g.target)}</strong> <span class="muted small">Stage ${g.stage} · ${esc(g.cueName||g.prompt)}</span><br>

function viewHistory(){
  const ss=S.sessions;
  if(!ss.length) return `<section class="panel"><h2>History</h2><div class="empty"><p class="muted" style="margin:0">No saved sessions yet. Finish a session to see accuracy per goal over time.</p></div></section>`;
  const goalIds=[], meta={};
  ss.forEach(s=>s.goals.forEach(g=>{ if(!meta[g.id]){ goalIds.push(g.id); } meta[g.id]={target:g.target, stage:g.stage}; }));
  const colorOf=id=>{ const i=S.client.goals.findIndex(g=>g.id===id); return i>=0?`var(--g${i+1})`:"var(--muted)"; };
  const W=640,H=260,L=40,R=16,T=14,B=34, n=ss.length;
  const x=i=> n===1 ? (L+W-R)/2 : L+(W-L-R)*i/(n-1), y=v=>T+(H-T-B)*(1-v/100);
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Accuracy per goal by session">`;
  [0,25,50,75,100].forEach(v=>{ svg+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`; });
  svg+=`<line x1="${L}" x2="${W-R}" y1="${y(90)}" y2="${y(90)}" stroke="var(--ok)" stroke-dasharray="5 4"/><text x="${W-R}" y="${y(90)-5}" text-anchor="end" font-size="11" fill="var(--ok)">90% step-up</text>`;
  const step=Math.ceil(n/8);
  ss.forEach((s,i)=>{ if(i%step===0||i===n-1) svg+=`<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(fmtDate(s.date).replace(/ \d{4}$/,""))}</text>`; });
  goalIds.forEach(id=>{
    const pts=ss.map((s,i)=>{ const g=s.goals.find(gg=>gg.id===id); return g&&g.acc!=null?[x(i),y(g.acc)]:null; });
    let d="", pen=false; pts.forEach(p=>{ if(p){ d+=(pen?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1); pen=true; } else pen=false; });
    const col=colorOf(id);
    svg+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>`;
    pts.forEach((p,i)=>{ if(p) svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:3.5}" fill="${col}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(meta[id].target)}: ${ss[i].goals.find(g=>g.id===id).acc}%</title></circle>`; });
  });
  svg+=`</svg>`;
  const legend=goalIds.map(id=>`<span><i class="gdot" style="background:${colorOf(id)}"></i>${esc(meta[id].target)} <span class="muted">S${meta[id].stage}</span></span>`).join("");
  const rows=[...ss].reverse().map(s=>`<tr>
    <td>${fmtDate(s.date)}</td><td class="num">${s.totalTrials}</td><td class="num">${s.acc??"–"}%</td>
    <td>${s.goals.map(g=>`<div class="small">${esc(g.target)}: <span class="num">${g.acc??"–"}%</span> ${g.step==="ready"?'<span class="chip ok">step-up</span>':g.step==="fade"?'<span class="chip warn">fade cues</span>':""}</div>`).join("")}${s.notes?`<div class="small muted" style="margin-top:4px">${esc(s.notes)}</div>`:""}</td>
    <td>${S.confirm==="s"+s.id?`<button class="btn danger small" data-act="sdel" data-v="${s.id}">Delete</button> <button class="btn small" data-act="noconfirm">Keep</button>`:`<button class="btn ghost small" data-act="ask" data-v="s${s.id}" aria-label="Delete session">✕</button>`}</td></tr>`).join("");
  // accuracy by word shape, within each goal
  const agg={}; const lastId=ss[ss.length-1].id;
  ss.forEach(s=>s.goals.forEach(g=>g.stimuli.forEach(st=>{
    const sh=st.shape||guessShape(st.word)||"?"; const key=g.id+"|"+sh;
    const a=agg[key] ||= {gid:g.id, shape:sh, c:0, t:0, lc:0, lt:0, words:new Set()};
    const c=st.trials.filter(x=>x).length; a.c+=c; a.t+=st.trials.length; a.words.add(st.word);
    if(s.id===lastId){ a.lc+=c; a.lt+=st.trials.length; }
  })));
  const shapeRows=goalIds.map(id=>Object.values(agg).filter(a=>a.gid===id&&a.t).sort((a,b)=>b.c/b.t-a.c/a.t).map((a,i)=>{
    const p=pct(a.c,a.t);
    return `<tr><td>${i===0?`<i class="gdot" style="background:${colorOf(id)}"></i> ${esc(meta[id].target)}`:""}</td>
      <td><span class="shape" style="margin:0">${esc(a.shape)}</span><div class="small muted">${[...a.words].map(esc).join(", ")}</div></td>
      <td class="num">${a.lt?pct(a.lc,a.lt)+"%":"–"}</td>
      <td><div class="row" style="gap:8px;flex-wrap:nowrap"><span class="num">${p}%</span><div class="sbar" style="flex:1"><i style="width:${p}%"></i></div></div><span class="small muted">${a.t} trials</span></td></tr>`;
  }).join("")).join("");
  return `<section class="panel">
    <div class="panel-h"><h2>Accuracy per goal</h2><span class="muted small">${n} session${n===1?"":"s"}</span></div>
    <div class="legend">${legend}</div>
    <div class="chartbox">${svg}</div>
  </section>
  <section class="panel">
    <div class="panel-h"><h2>By word shape</h2><span class="muted small">Easiest first, within each goal</span></div>
    <div class="tbl"><table><thead><tr><th>Goal</th><th>Shape</th><th>Last session</th><th>All sessions</th></tr></thead><tbody>${shapeRows}</tbody></table></div>
  </section>
  <section class="panel"><h2>Sessions</h2>
    <div class="tbl"><table><thead><tr><th>Date</th><th>Trials</th><th>Acc.</th><th>Goals</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  </section>`;
}

function recordSnap(){
  const c=S.client; c.pmvDate=c.pmvDate||today();
  const h=(c.pmvHistory ||= []); const snap={date:c.pmvDate, pmv:clone(c.pmv||{}), vowels:clone(c.vowels||{})};
  const i=h.findIndex(x=>x.date===c.pmvDate); if(i>=0) h[i]=snap; else h.push(snap);
  h.sort((a,b)=>a.date.localeCompare(b.date)); c.pmvUpdated=c.pmvDate;
}
function setChartDate(d){
  const c=S.client, h=(c.pmvHistory ||= []), snap=h.find(x=>x.date===d);
  c.pmvDate=d;

function fxCurrent(){
  const L=ensureFx(), items=fxItems(); if(!items.length) return null;
  let cur=L.cur && items.find(x=>x.g.id===L.cur.gid && x.si===L.cur.si);
  if(!cur){ cur=fxPickNext(null); }
  return cur;
}
function fxPickNext(cur){
  const L=ensureFx(), items=fxItems(); if(!items.length) return null;
  const left=x=>Math.max(0, softFor(x.g)-(lgFix(x.g).trials[x.si]||[]).length);
  let next;
  if(L.mode==="blocked" && cur){
    if(S.fx.rep<5 && left(cur)>0) next=cur;
    else { const same=items.filter(x=>x.g.id===cur.g.id); const i=same.findIndex(x=>x.si===cur.si);
      next = same.slice(i+1).concat(same.slice(0,i)).find(x=>left(x)>0);
      if(!next){ const gs=sessionGoals(); const gi=gs.findIndex(g=>g.id===cur.g.id); const og=gs.slice(gi+1).concat(gs.slice(0,gi+1)); for(const g of og){ next=items.find(x=>x.g.id===g.id&&left(x)>0); if(next) break; } }
      S.fx.rep=0; }
  } else {
    const pk=L.peek && items.find(x=>x.g.id===L.peek.gid && x.si===L.peek.si);
    next = (pk && !(cur && pk.g.id===cur.g.id && pk.si===cur.si)) ? pk : pickRandom(cur);
    L.peek=null; S.fx.rep=0;
  }
  next ||= items[0];
  L.cur={gid:next.g.id, si:next.si}; saveLive();

}
function pickRandom(cur){
  const items=fxItems(); const left=x=>Math.max(0, softFor(x.g)-(lgFix(x.g).trials[x.si]||[]).length);
  const notCur=x=>!(cur && x.g.id===cur.g.id && x.si===cur.si);
  let pool=items.filter(x=>left(x)>0 && notCur(x));
  if(!pool.length) pool=items.filter(notCur);
  if(!pool.length) pool=items;
  // keep goals balanced: favour goals with fewer trials so far
  const tot=g=>lgFix(g).trials.reduce((a,t)=>a+t.length,0);

/* session note */
function sessionNote(r){
  const lines=[`Session ${fmtDate(r.date)}: ${r.totalTrials} trials, ${r.acc??"–"}% accurate overall.`];
  r.goals.forEach(g=>{ if(!g.total) return;
    const cl=Object.entries(g.cueStats||{}).sort((a,b)=>+a[0]-+b[0]).map(([i,o])=>`${CUE_LADDER[i][0].toLowerCase()} ${o.c}/${o.t}`).join(", ");
    const sx=Object.entries(g.sx||{}).sort((a,b)=>b[1].t-a[1].t).slice(0,4).map(([id,o])=>`${(elById(id)?.label||id).replace(/\s*\(.*\)$/,"").toLowerCase()} (${o.c}/${o.t})`).join("; ");
    const words=g.stimuli.filter(s=>s.trials.length).map(s=>`${s.word} ${s.trials.filter(Boolean).length}/${s.trials.length}`).join(", ");
    const ri=g.reint.map((x,i)=>x?(S.client.goals.find(cg=>cg.id===g.id)?.stimuli[i]||""):null).filter(Boolean);
    lines.push(`\n${g.target}: ${g.correct}/${g.total} (${g.acc}%). Final cue level: ${(g.cueName||g.prompt||"").toLowerCase()}.`
      + (cl?` By cue level: ${cl}.`:"")
      + (g.near?` Nearly (close approximations, counted as not yet): ${g.near}.`:"")
      + (Object.keys(g.modStats||{}).length?` Prompt types: ${Object.entries(g.modStats).sort((a,b)=>b[1].t-a[1].t).map(([k,o])=>`${k.toLowerCase()} ${o.c}/${o.t}`).join("; ")}.`:"")
      + (sx?` Strategies: ${sx}.`:"")
      + `\n  Words: ${words}.`
      + (ri.length?`\n  Re-integrate next session: ${ri.join(", ")}.`:"")
      + (g.step==="ready"?"\n  Plan: step up (90%+ independently).": g.step==="fade"?"\n  Plan: fade cues next session.":""));
  });
  if(r.notes?.trim()) lines.push(`\nNotes: ${r.notes.trim()}`);
  return lines.join("\n");
}

const BOWEN_TIPS=[
  ["Talking time","5 to 7 minutes a day, same place, same time. Keep it short and end on a win."],
  ["Lots of tries","Short bursts with many repeats help more than one long session."],
  ["Praise every try","Respond to every attempt, then say the word back once, clearly."],
  ["Brag book","Photos of words your child can say. Add to it and bring it to every session."],
  ["Keep it fresh","Change the game, keep the words. Follow your child's interests."],

function kidTitle(g){
  if(g.kidName?.trim()) return g.kidName.trim();
  const f=g.filter||{}, snd=f.sound;
  if(BLENDS[snd]) return `Blends with ${({"#l":"L","#r":"R","#s":"S","#w":"W"})[snd]}`;
  if(snd && KID_SOUND[snd]){ const pos={I:" at the start",M:" in the middle",F:" at the end"}[f.pos]||""; const n=KID_SOUND[snd]; return `${n[0].toUpperCase()+n.slice(1)} sound${pos}`; }
  if(snd) return `/${snd}/ sound`;
  return g.target||"Speech practice";
}
function kidBadge(g){ const snd=g.filter?.sound; if(BLENDS[snd]) return ({"#l":"bl","#r":"tr","#s":"sn","#w":"sw"})[snd]; return snd||"★"; }
function goalHistory(g){ return (S.sessions||[]).map(s=>({date:s.date, g:s.goals.find(x=>x.id===g.id)})).filter(x=>x.g && x.g.total); }
function goalStars(g){ const h=goalHistory(g); if(!h.length) return 0; const last=h.slice(-2); const c=last.reduce((a,x)=>a+x.g.correct,0), t=last.reduce((a,x)=>a+x.g.total,0); return Math.max(h.length?1:0, Math.round(c/t*5)); }
function canSayWords(){
  const recent=(S.sessions||[]).slice(-3), m={};
  recent.forEach(s=>s.goals.forEach(g=>g.stimuli.forEach(st=>{ const o=(m[st.word] ||= {c:0,t:0}); o.c+=st.trials.filter(Boolean).length; o.t+=st.trials.length; })));
  return Object.entries(m).filter(([,o])=>o.t>=4 && o.c/o.t>=.8).map(([w])=>w);
}
function familyData(){
  const c=S.client, gs=homeGoals(), ss=S.sessions||[];
  const inMonth=ss.filter(s=>Date.now()-new Date(s.date).getTime()<=31*864e5);
  const month=inMonth.reduce((a,s)=>a+s.totalTrials,0), monthStars=inMonth.reduce((a,s)=>a+(s.totalCorrect||0),0);
  const trend=ss.slice(-6).map(s=>({date:s.date, acc:s.acc}));
  return {c, gs, month, monthStars, trend, can:canSayWords(), words:gs.flatMap(g=>g.stimuli.filter(w=>w.trim())).slice(0,18)};
}

/* ---------- Sounds (tiny synth; only after a tap) ---------- */
let AC=null;
function snd(kind){
  if(!S.client?.sound) return;
  try{ AC ||= new (window.AudioContext||window.webkitAudioContext)(); const t=AC.currentTime;
    const tone=(f,d,st=0,type="sine",v=.15)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t+st); g.gain.setValueAtTime(v,t+st); g.gain.exponentialRampToValueAtTime(.001,t+st+d); o.connect(g); g.connect(AC.destination); o.start(t+st); o.stop(t+st+d+.02); };
    if(kind==="pop") tone(660,.08,0,"triangle");
    else if(kind==="star"){ tone(880,.1); tone(1320,.14,.08); }
    else if(kind==="hop") tone(520,.06,0,"square",.05);
    else if(kind==="roll"){ for(let i=0;i<6;i++) tone(300+Math.random()*300,.04,i*.07,"square",.04); }
    else if(kind==="tick") tone(1200,.02,0,"square",.03);
    else if(kind==="win"){ [523,659,784,1047].forEach((f,i)=>tone(f,.18,i*.12,"triangle",.16)); }
    else if(kind==="munch"){ tone(180,.08,0,"sawtooth",.08); tone(140,.1,.1,"sawtooth",.08); }
    else if(kind==="burp"){ const o=AC.createOscillator(), g=AC.createGain(); o.type="sawtooth"; o.frequency.setValueAtTime(110,t); o.frequency.linearRampToValueAtTime(60,t+.6); g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.001,t+.65); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.7); }
    else if(kind==="flip") tone(740,.05,0,"triangle",.08);
  }catch(e){}
}

function gstate(){ const L=ensureLive(); L.game ||= {type:S.client.lastGame||"", turns:[], board:{pos:0,boards:0}, spin:{score:0,rot:0}, memory:null, munch:{fed:0,level:1}}; return L.game; }

function canPlay(G){ if(G.type==="road" || S.fx.busy) return false; return !G.await; }
/* Reveal: a game move shows the next practice word. Child-led logs it as a correct try straight away. */
function reveal(G,item){
  const L=ensureFx(); if(item){ L.cur={gid:item.gid, si:item.si}; L.peek=null; }
  const cur=fxCurrent(); if(!cur) return; G.shown=true;
  G.await=true; G.revealed={gid:cur.g.id, si:cur.si}; G.tries=0;
  snd("flip"); saveLive();
}
function takeBonus(G){ const s=!!G.bonus; G.bonus=false; return s; }

function markLastNotYet(){
  const L=ensureFx(); const gid=L.hist[L.hist.length-1]; const g=S.client.goals.find(x=>x.id===gid); if(!g) return null;
  const lg=lgFix(g), e=lg.log[lg.log.length-1]; if(!e || !e.v) return null;
  e.v=false; const tr=lg.trials[e.si]; if(tr && tr.length) tr[tr.length-1]=false; const sq=seqOf(L); if(sq.length) sq[sq.length-1]=false;
  saveLive(); return g.stimuli[e.si];
}
function lastTry(){ const L=ensureFx(); const gid=L.hist[L.hist.length-1]; const g=S.client.goals.find(x=>x.id===gid); if(!g) return null; const e=lgFix(g).log.slice(-1)[0]; return e?{w:g.stimuli[e.si], v:e.v}:null; }

/* --- Board game (Dino Dash) --- */
const BOARD_N=25, BRIDGES={3:9,8:14,13:19,17:23}, BONUS=[6,11,16,21];
const boardCell=n=>{ const r=Math.floor((n-1)/5), c=(n-1)%5; return {r, c: r%2? 4-c : c}; };
function boardHTML(G){
  const tiles=[]; for(let n=1;n<=BOARD_N;n++){ const {r,c}=boardCell(n); const br=BRIDGES[n], bo=BONUS.includes(n);
    tiles.push(`<div class="bt ${br?"br":""} ${bo?"bo":""} ${n===BOARD_N?"end":""}" style="grid-row:${5-r};grid-column:${c+1}" data-n="${n}"><span>${n===BOARD_N?"🥚":br?"🌉":bo?"⭐":n}</span></div>`); }
  const tok = G.board.pos ? (()=>{ const {r,c}=boardCell(G.board.pos); return `grid-row:${5-r};grid-column:${c+1}`; })() : "grid-row:5;grid-column:1";
  return `<div class="bwrap"><div class="board">${tiles.join("")}<div class="btok" id="btok" style="${tok}"><span>🦖</span></div></div></div>`;
}
async function playBoard(){
  const G=gstate(); const dieEl=document.getElementById("gdie"), tok=document.getElementById("btok"); if(!dieEl||!tok||!canPlay(G)) return;
  const star=takeBonus(G); S.fx.busy=true; snd("roll");
  let face=1; for(let i=0;i<9;i++){ face=1+Math.floor(Math.random()*6); dieEl.textContent=["⚀","⚁","⚂","⚃","⚄","⚅"][face-1]; dieEl.classList.toggle("rot"); await sleep(70); }
  const steps=face+(star?1:0);
  if(star){ const b=document.getElementById("gdieb"); if(b) b.hidden=false; }
  const place=n=>{ const {r,c}=boardCell(n); tok.style.gridRow=5-r; tok.style.gridColumn=c+1; };
  let p=G.board.pos;
  for(let i=0;i<steps && p<BOARD_N;i++){ p++; place(p); snd("hop"); tok.classList.remove("hp"); void tok.offsetWidth; tok.classList.add("hp"); await sleep(260); }

let STAR_RAF=0, STAR_TGT=null; const STAR_KEYS={};
function starStart(){
  if(STAR_RAF) return; let last=performance.now();
  const step=t=>{
    const G=gstate(), sky=document.getElementById("gsky"), ship=document.getElementById("gship");
    if(G.type!=="stars" || !sky || !ship){ STAR_RAF=0; STAR_TGT=null; return; }
    const dt=Math.min(50,t-last); last=t; const T=G.stars;
    if(!G.await && !S.fx.busy){
      const r=sky.getBoundingClientRect(); if(!r.width){ STAR_RAF=requestAnimationFrame(step); return; }
      let want=null; const kx=(STAR_KEYS.ArrowRight?1:0)-(STAR_KEYS.ArrowLeft?1:0), ky=(STAR_KEYS.ArrowDown?1:0)-(STAR_KEYS.ArrowUp?1:0);
      if(kx||ky){ want=Math.atan2(ky,kx)*180/Math.PI; STAR_TGT=null; }
      else if(STAR_TGT){ const dx=(STAR_TGT.x-T.sx)*r.width/100, dy=(STAR_TGT.y-T.sy)*r.height/100; if(Math.hypot(dx,dy)>10) want=Math.atan2(dy,dx)*180/Math.PI; }
      if(want!=null){ const d=((want-T.a+540)%360)-180; T.a+=Math.max(-1,Math.min(1,d/30))*0.35*dt; }
      const sp=.12*dt;
      T.sx+=Math.cos(T.a*Math.PI/180)*sp*100/r.width; T.sy+=Math.sin(T.a*Math.PI/180)*sp*100/r.height;
      if(T.sx<4){T.sx=4;T.a=180-T.a;} if(T.sx>96){T.sx=96;T.a=180-T.a;} if(T.sy<8){T.sy=8;T.a=-T.a;} if(T.sy>92){T.sy=92;T.a=-T.a;}
      ship.style.left=T.sx+"%"; ship.style.top=T.sy+"%"; ship.style.setProperty("--a",(T.a+45)+"deg");
      if(Math.hypot((T.x-T.sx)*r.width/100,(T.y-T.sy)*r.height/100)<36) starCatch();
    }
    STAR_RAF=requestAnimationFrame(step);
  };
  STAR_RAF=requestAnimationFrame(step);
}

const TTT_LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const tttWin=(b,p)=>TTT_LINES.some(l=>l.every(i=>b[i]===p));
function tttHTML(G){
  G.ttt ||= {b:Array(9).fill(""), wins:0, games:0, over:false}; const T=G.ttt, can=canPlay(G)&&!T.over;

    <div class="brl-n">You ⭐ vs Munch 🍪 · wins ${T.wins}</div></div>`;

async function tttMove(i){
  const G=gstate(); if(!canPlay(G)) return; const T=G.ttt; if(T.over||T.b[i]) return; takeBonus(G);
  T.b[i]="x"; snd("pop"); reveal(G); renderMain();
  const end=async(msg,win)=>{ T.over=true; T.games++; if(win) T.wins++; saveLive(); renderMain(); celebrate(msg); await sleep(2600); T.b=Array(9).fill(""); T.over=false; saveLive(); renderMain(); };
  if(tttWin(T.b,"x")){ const st=giveSticker(); return end(`<div class="gfx-e">⭐⭐⭐</div><b>You win!</b><span>Sticker: ${st}</span>`,true); }
  if(T.b.every(Boolean)) return end(`<div class="gfx-e">🤝</div><b>It's a draw!</b>`);
  S.fx.busy=true; await sleep(600); S.fx.busy=false;
  const free=T.b.map((c,k)=>c?null:k).filter(k=>k!=null);
  const tryP=p=>free.find(k=>{ const b=[...T.b]; b[k]=p; return tttWin(b,p); });
  let m=tryP("o"); if(m==null) m=tryP("x"); if(m==null) m=free.includes(4)&&Math.random()<.5?4:free[rnd(free.length)];
  T.b[m]="o"; snd("flip"); saveLive(); renderMain();
  if(tttWin(T.b,"o")) return end(`<div class="gfx-e">🍪</div><b>Munch wins this time!</b><span>New game coming…</span>`);
  if(T.b.every(Boolean)) return end(`<div class="gfx-e">🤝</div><b>It's a draw!</b>`);
}

function mouthA(place,feel,s){

    case "teeth": return `${lipsOpen(96,146)}${teethTop}<path d="M128 118 Q160 108 192 118 Q196 136 160 142 Q124 136 128 118 Z" fill="${tongue}" stroke="${tEdge}" stroke-width="2"/>${teethBot(140)}${lowLip(150)}${upLip}`;

    case "smile": return `<path d="M72 118 Q160 96 248 118 L248 134 Q160 156 72 134 Z" fill="${dark}"/><g>${[0,1,2,3,4,5,6].map(i=>`<rect x="${98+i*18}" y="112" width="16" height="14" rx="3" fill="${tooth}" stroke="${tStroke}"/>`).join("")}</g><g>${[0,1,2,3,4,5,6].map(i=>`<rect x="${100+i*18}" y="127" width="14" height="12" rx="3" fill="${tooth}" stroke="${tStroke}"/>`).join("")}</g><path d="M70 118 Q160 94 250 118 Q160 112 70 118Z" fill="${lip}"/><path d="M70 136 Q160 160 250 136 Q160 150 70 136Z" fill="${lip}"/>`;
    case "round": return `<ellipse cx="160" cy="132" rx="30" ry="34" fill="${dark}"/><ellipse cx="160" cy="132" rx="44" ry="46" fill="none" stroke="${lip}" stroke-width="14"/><path d="M130 108 Q160 96 190 108" stroke="${lipHi}" stroke-width="4" fill="none"/>`;
    case "back": return `${lipsOpen(96,172)}${teethTop}<path d="M108 178 Q116 134 160 130 Q204 134 212 178 Z" fill="${tongue}" stroke="${tEdge}" stroke-width="2"/><path d="M136 134 Q160 104 184 134" fill="#d9707f" stroke="${tEdge}" stroke-width="2"/><circle cx="160" cy="104" r="5" fill="#ffd54f"/>${lowLip(174)}${upLip}`;

  }

/* Review: every try in order; tap to cycle said it → nearly → not yet. */
function tryList(){
  const L=ensureFx(), cnt={}, out=[];
  L.hist.forEach((gid,k)=>{ const g=S.client.goals.find(x=>x.id===gid); if(!g) return; const lg=lgFix(g); const i=(cnt[gid]=(cnt[gid]??-1)+1); const e=lg.log[i]; if(e) out.push({g,lg,i,k,e}); });
  return out;
}
function reviewHTML(){
  const ts=tryList(); if(!ts.length) return "";
  return `<div class="rvw"><p class="muted small">Tap a word to change it: ✓ said it → ≈ nearly → · not yet.</p><div class="rvw-g">${ts.map(t=>{ const st=t.e.v?"ok":t.e.near?"near":"no"; return `<button class="rv ${st}" data-act="rvflip" data-gid="${t.g.id}" data-i="${t.i}" data-k="${t.k}"><span>${st==="ok"?"✓":st==="near"?"≈":"·"}</span>${esc(t.g.stimuli[t.e.si]||"")}</button>`; }).join("")}</div></div>`;
}
function roadTop(L,seq){
  const cur=fxCurrent(), word=cur.g.stimuli[cur.si], pic=lgFix(cur.g).mod.includes("picture")?picOf(word):"";
  const th=THEMES[S.client.theme]||THEMES.car;
  const t=seq.length, stars=seq.filter(Boolean).length;
  const done=t>0 && t%10===0 && S.fx.celebrate;
  const road=done ? t/10 : Math.floor(t/10)+1, within=done ? 10 : t%10;
  const block=done ? seq.slice(t-10) : seq.slice(t-within);
  const pos=i=>4+i*(86/9);
  const dots=Array.from({length:10},(_,i)=>{ const v=block[i]; return `<span class="gdot2 ${v===undefined?"":v?"st":"tr"}" style="left:${pos(i)}%">${v?"★":""}</span>`; }).join("");
  const carLeft = within ? pos(within-1) : 0, last=seq[t-1];
  return `<div class="gm ${th.flip?"":"noflip"}" style="background:${th.bg}">
      <div class="gm-hud"><span class="gm-pill">${th.e} Road ${road} of ${Math.max(10,Math.ceil(DOSE_LO/10))}</span><span class="gm-pill gm-stars">★ ${stars}</span></div>
      <div class="gm-word">${pic?`<i>${pic}</i>`:""}${esc(word)}</div>
      <div class="gm-track">
        <div class="gm-road" style="background:${th.road}"><i style="border-color:${th.lane}"></i></div>
        ${dots}
        <span class="gdot2 prize ${done?"won":""}" style="left:96%">${th.prize}</span>
        <span class="gm-car ${within?"hop":""}" style="left:${t?(done?96:carLeft):0}%">${th.e}</span>
        ${t && last && !done?`<span class="gm-burst" style="left:${carLeft}%">+1★</span>`:""}
      </div>
      ${done?`<div class="gm-win" data-act="gmwin"><div><div class="gm-win-e">${th.prize}</div><b>Road ${t/10} done!</b><span>${stars} stars so far</span></div></div>`:""}
    </div>`;
}

  { const setTiles=(ax,map)=>{ ax.ph=map; ["cv","cvc","cvcv","multi","clus"].forEach(k=>{ const sc=ax.scores[k]={}; ASECS.find(x=>x.k===k).items.forEach((_,i)=>{ sc[i]= map[k]?.[i] ? "0" : "1"; }); }); };
    // 1st: fronting, final consonant deletion, cluster reduction, gliding, weak syllable trouble
    setTiles(c.assessments[0], {cv:{7:{0:"t"},8:{0:"t"},3:{0:"d"},17:{1:"∅"}}, cvc:{0:{0:"t",2:"∅"},9:{0:"t",2:"∅"},5:{2:"∅"},10:{2:"∅"},8:{2:"∅"},6:{0:"d",2:"w"},13:{0:"w"},16:{0:"w",2:"∅"},11:{2:"∅"}},
      cvcv:{3:{0:"t",2:"t"},9:{0:"t"},10:{0:"t",2:"ʔ"},11:{0:"d"},12:{2:"d"},16:{0:"t",2:"ʃ"},17:{0:"t"},15:{2:"w"}},
      multi:{0:{2:"t"},1:{2:"t"},3:{1:"∅"},6:{0:"t"},9:{0:"t",1:"w"},14:{0:"t"},15:{5:"w"}},
      clus:{0:{0:"∅"},1:{0:"∅",1:"t"},2:{0:"∅"},3:{0:"∅"},4:{1:"w"},5:{1:"w"},6:{0:"t",1:"w",3:"t"},7:{1:"w"},8:{1:"w"},9:{1:"w",3:"d"},10:{3:"∅"},13:{0:"t",1:"w",4:"∅"},14:{3:"∅"}}});
    // 2nd: /k g/ initial still fronted, finals now in, s-clusters emerging
    setTiles(c.assessments[1], {cv:{7:{0:"t"},8:{0:"t"},3:{0:"d"}}, cvc:{0:{0:"t"},9:{0:"t"},10:{2:"t"},6:{0:"d"}},
      cvcv:{3:{0:"t"},9:{0:"t"},11:{0:"d"},16:{0:"t"}},
      multi:{6:{0:"t"},9:{0:"t",1:"w"},14:{0:"t"},3:{1:"∅"}},
      clus:{1:{0:"∅",1:"t"},4:{1:"w"},6:{0:"t",1:"w"},7:{1:"w"},9:{1:"w"},13:{0:"t",1:"w"}}});
    c.assessments[1].ins={clus:{2:{1:["ə"]},3:{1:["ə"]}}, cvc:{1:{3:["ə"]}}}; ["clus:2","clus:3","cvc:1"].forEach(x=>{ const [k,i]=x.split(":"); c.assessments[1].scores[k][i]="0"; }); }
  { const keep=S.client; S.client=c; c.assessments.forEach(x=>syncAssessToPMV(x)); S.client=keep; }
  try{
    await store.saveClient(c);
    if(S.mode==="db" && !S.clients.find(x=>x.id===c.id)) S.clients.push(clone(c));
    for(const s of sess) await store.addSession(c.id, s);
  }catch(err){ toast("Couldn't create the example. Try again."); return; }
  openClient(c.id);
}

/* ---------- boot ---------- */
(async function boot(){
  render();
  const use = window.claude?.use ? n=>window.claude.use(n).catch(()=>null) : async()=>null;
  const [db,user,dl] = await Promise.all([use("db"), use("user"), use("downloads")]);
  S.downloads=dl;
  let uid=null; try{ uid = user ? await user.id() : null; }catch(e){}
  if(db && uid){
    S.db=db; S.uid=uid; S.mode="db";
    let first=true;
    db.collection("data/users/"+uid).onSnapshot(snap=>{
      S.clients=snap.docs.map(d=>({id:d.id, ...d.data()}));
      syncClient();
      const typing = document.activeElement && document.activeElement.matches("input[type=text],textarea");
      if(first || !S.client){ first=false; render(); }
      else if(!typing && S.tab!=="session") renderMain(); else renderBar();
    }, err=>{ setStatus("Offline"); toast("Lost connection to saved data. Reload the page."); });
  } else {
    S.mode="mem"; render();
  }
})();

/* ===== Bridge it play: Slide it in / Hold the hiss / Stepping stones ===== */
(function(){
  const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let B=null, lastMode="slide"; // {list:[{bk,it}], i, mode, k, done, goes, step, x}
  const pic=w=>{ try{ return picOf(w)||""; }catch(e){ return ""; } };
  function parts(it){ return it; }
  function boom(host,x,y){ const b=document.createElement("div"); b.className="brp-cfx"; b.style.left=x+"px"; b.style.top=y+"px"; const cs=["#ff6b8b","#ffb020","#4fc3f7","#8e7cff","#5fcf8c"];
    for(let k=0;k<20;k++){ const e=document.createElement("i"), a=Math.random()*6.28, d=40+Math.random()*70; e.style.setProperty("--x",(Math.cos(a)*d).toFixed(0)+"px"); e.style.setProperty("--y",(Math.sin(a)*d).toFixed(0)+"px"); e.style.background=cs[k%5]; b.appendChild(e); } host.appendChild(b); setTimeout(()=>b.remove(),900); }
  function say(t){ try{ const u=new SpeechSynthesisUtterance(t); const v=speechSynthesis.getVoices().find(x=>x.lang==="en-AU"); if(v) u.voice=v; u.lang="en-AU"; u.rate=.8; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
  const cur=()=>B.list[B.i];
  const canHiss=a=>/(s|z|f|v|m|n|l|r|h|sh|th|w|y|a|e|i|o|u)$/i.test(String(a||"").trim());
  function stageHTML(){ const {it}=cur(), P=parts(it), f=it.f;
    if(B.mode==="slide") return `<div class="brp-stage" id="brpStage">
        <div class="brp-piece a" id="brpA" style="left:${B.x}%">${P.pa?`<span class="brp-pic">${P.pa}</span>`:""}<b>${E(P.A)}</b></div>
        <div class="brp-piece b" id="brpB">${P.pb?`<span class="brp-pic">${P.pb}</span>`:""}<b>${E(P.B)}</b></div>
        <div class="brp-res" id="brpRes" ${B.done?"":"hidden"}>${P.pw?`<span class="brp-pic big">${P.pw}</span>`:""}<b>${E(P.W)}</b></div>
        <div class="brp-say" id="brpSay">${B.done?"":E(P.A)+" + "+E(P.B)}</div></div>
      <div class="brp-steps">${f.map((x,i)=>`<button data-brp="auto" data-v="${i}">${E(x)}</button>`).join("")}</div>
      <p class="brp-tip">${B.done?"":"Slide the first part across to join it up."}</p>`;
    if(B.mode==="hiss") return `<div class="brp-stage" id="brpStage">
        <div class="brp-snake" id="brpSnake"></div><div class="brp-hlab" id="brpHlab">${E(P.A)}</div>
        <div class="brp-piece b dim" id="brpB" style="left:76%">${P.pb?`<span class="brp-pic">${P.pb}</span>`:""}<b>${E(P.B)}</b></div>
        <div class="brp-res" id="brpRes" ${B.done?"":"hidden"}>${P.pw?`<span class="brp-pic big">${P.pw}</span>`:""}<b>${E(P.W)}</b></div>
        <div class="brp-say" id="brpSay">${B.done?"":(P.hold??canHiss(P.A))?"Hold the button and keep the sound going…":"Hold it… then let go into the next word"}</div></div>
      <button class="brp-hold" id="brpHold" ${B.done?"disabled":""}>${(P.hold??canHiss(P.A))?`Hold me: ${E(P.A)}${E(P.hl||String(P.A).slice(-1)).repeat(3)}…`:`Hold me: ${E(P.A)}… then let go`}</button>`;
    return `<div class="brp-stage river" id="brpStage">
        <div class="brp-frog" id="brpFrog" style="left:${[4,22,48,74][B.step+1]}%">🐸</div>
        <div class="brp-bank">${P.pw?`<span class="brp-pic">${B.step>=2?P.pw:(P.pb||"🏁")}</span>`:"🏁"}</div>
        <div class="brp-stones">${f.map((x,i)=>`<button class="brp-stone ${i<=B.step?"done":""}" data-brp="stone" data-v="${i}">${E(x)}</button>`).join("")}</div>
        <div class="brp-say" id="brpSay">${B.step<0?"Tap the first stone":"Say: <b>"+E(f[B.step])+"</b>"}</div></div>`;
  }
  function draw(){ const o=document.getElementById("brp"); if(!o||!B) return; const {it}=cur(), P=parts(it);
    o.innerHTML=`<div class="brp-box">
      <div class="brp-top"><b>Bridge it</b><span class="brp-seg">${[["slide","Slide it in"],["hiss","Hold the sound"],["stones","Stepping stones"]].map(([v,l])=>`<button data-brp="mode" data-v="${v}" aria-pressed="${B.mode===v}">${l}</button>`).join("")}</span>
        <span class="brp-nav"><button data-brp="prev" ${B.i?"":"disabled"} aria-label="Previous">‹</button><span>${B.i+1}/${B.list.length}</span><button data-brp="next" ${B.i<B.list.length-1?"":"disabled"} aria-label="Next">›</button></span>
        <span class="brp-goes">★ ${B.goes}</span><button class="brp-x" data-brp="close">Close</button></div>
      <div class="brp-main">${stageHTML()}${P.alts?`<div class="brp-alts"><span>VC word:</span>${P.alts.map(a=>`<button data-brp="alt" data-v="${E(a)}" aria-pressed="${a===P.A}">${E(a)}</button>`).join("")}<input class="brp-own" id="brpOwn" placeholder="+ your own" aria-label="Your own VC word"></div>`:""}</div>
      <div class="brp-foot ${B.done?"show":""}"><button data-brp="hear" class="brp-g">🔊 ${E(P.W)}</button><span style="flex:1"></span><button data-brp="again" class="brp-g">↻ Again</button><button data-brp="said" class="brp-ok">✓ Said it</button></div>
    </div>`;
    bind(); }
  function finish(){ if(B.done) return; B.done=true; const st=document.getElementById("brpStage"); const res=document.getElementById("brpRes");
    ["brpA","brpB","brpSnake","brpHlab"].forEach(id=>{ const e=document.getElementById(id); if(e) e.classList.add("gone"); });
    if(res){ res.hidden=false; res.classList.add("pop"); } const s=document.getElementById("brpSay"); if(s) s.textContent="";
    if(st) boom(st, st.clientWidth*.5, st.clientHeight*.4);
    const f=document.querySelector("#brp .brp-foot"); if(f) f.classList.add("show"); const hb=document.getElementById("brpHold"); if(hb) hb.disabled=true; const sy=document.getElementById("brpSay"); if(sy) sy.textContent=""; }
  function setX(x){ const P=parts(cur().it); B.x=Math.max(2,Math.min(56,x)); const a=document.getElementById("brpA"); if(a) a.style.left=B.x+"%"; const g=56-B.x;
    const s=document.getElementById("brpSay"); if(s && !B.done) s.innerHTML = g>28?`${E(P.A)} + ${E(P.B)}`:g>5?`${E(P.A)}${"‑".repeat(Math.max(1,Math.round(g/7)))}${E(P.B)}`:`<b>${E(P.W)}</b>`;
    if(g<=5) finish(); }
  function bind(){
    const o=document.getElementById("brp");
    o.querySelectorAll("[data-brp]").forEach(b=>b.onclick=()=>act(b.dataset.brp,b.dataset.v,b));
    const a=document.getElementById("brpA");
    if(a && B.mode==="slide" && !B.done){ let drag=false, off=0;
      a.onpointerdown=e=>{ drag=true; a.setPointerCapture(e.pointerId); const r=a.getBoundingClientRect(); off=e.clientX-r.left; a.classList.add("drag"); };
      a.onpointermove=e=>{ if(!drag) return; const st=document.getElementById("brpStage").getBoundingClientRect(); setX((e.clientX-off-st.left)/st.width*100); };
      a.onpointerup=a.onpointercancel=()=>{ drag=false; a.classList.remove("drag"); }; }
    const own=document.getElementById("brpOwn");
    if(own) own.onkeydown=e=>{ if(e.key!=="Enter") return; const w=own.value.trim().toLowerCase(); if(!w) return; const it=cur().it; try{ S.client.vcOwn=S.client.vcOwn||{}; const l=(S.client.vcOwn[it.k] ||= []); if(!l.includes(w)) l.push(w); }catch(err){} act("alt",w); };
    const h=document.getElementById("brpHold");
    if(h && !B.done){ let t=null, w=0; const sn=document.getElementById("brpSnake"), lab=document.getElementById("brpHlab"), P=parts(cur().it), ch=P.hl||String(P.A).slice(-1);
      const start=e=>{ e.preventDefault(); if(B.done) return; clearInterval(t); w=0; const s0=document.getElementById("brpSay"); if(s0) s0.textContent=""; t=setInterval(()=>{ w=Math.min(w+3,100); sn.style.width=(8+w*.6)+"%"; lab.textContent=(P.hold??canHiss(P.A))?P.A+ch.repeat(Math.round(w/(ch.length>1?14:10))):P.A+" "+"·".repeat(Math.round(w/12)); h.classList.add("on"); },60); };
      const end=()=>{ if(!t) return; clearInterval(t); t=null; h.classList.remove("on"); const s=document.getElementById("brpSay");
        if(w<25){ if(s) s.textContent="Hold a bit longer!"; sn.style.width="8%"; lab.textContent=P.A; return; }
        const b=document.getElementById("brpB"); if(b){ b.classList.remove("dim"); b.style.left=(8+w*.6+2)+"%"; }
        setTimeout(finish,380); };
      h.addEventListener("pointerdown",start); h.addEventListener("pointerup",end); h.addEventListener("pointerleave",end); h.addEventListener("pointercancel",end); }
  }
  function reset(){ B.done=false; B.step=-1; B.x=4; }
  function act(a,v,el){
    if(a==="close"){ close(); return; }
    if(a==="mode"){ B.mode=v; lastMode=v; reset(); draw(); return; }
    if(a==="prev"){ B.i=Math.max(0,B.i-1); reset(); draw(); return; }
    if(a==="next"){ B.i=Math.min(B.list.length-1,B.i+1); reset(); draw(); return; }
    if(a==="again"){ reset(); draw(); return; }
    if(a==="hear"){ say(parts(cur().it).W); return; }
    if(a==="said"){ const {it}=cur(); try{ it.said&&it.said(); }catch(e){} B.goes++; reset();
      if(B.i<B.list.length-1) B.i++; draw(); try{ toast("Added to the tally"); }catch(e){} return; }
    if(a==="alt"){ const c=cur(); const it=c.it; const nw=Object.assign(brMake(it.B,it.k,v),{said:it.said}); c.it=nw; try{ S.client.vcPick=S.client.vcPick||{}; S.client.vcPick[it.k]=v; scheduleSave(); }catch(e){} reset(); draw(); return; }
    if(a==="auto"){ const i=+v; const ap=document.getElementById("brpA"); if(ap){ ap.style.transition="left .5s"; setTimeout(()=>{ if(ap) ap.style.transition=""; },520); } setX(i===0?4:i===1?44:57); return; }
    if(a==="stone"){ const i=+v; if(i!==B.step+1) return; B.step=i; draw(); if(i===2) setTimeout(()=>{ B.done=false; finish(); },420); return; }
  }
  function close(){ const o=document.getElementById("brp"); if(o) o.remove(); B=null; document.documentElement.style.overflow=""; try{ renderMain(); }catch(e){} }
  window.brOpenList=function(list,start){ if(!list||!list.length){ try{ toast("No words to bridge yet."); }catch(e){} return; }
    B={list:list.map(it=>({it})),i:Math.max(0,start||0),mode:lastMode,goes:0}; reset();
    let o=document.getElementById("brp"); if(!o){ o=document.createElement("div"); o.id="brp"; o.setAttribute("role","dialog"); o.setAttribute("aria-modal","true"); o.setAttribute("aria-label","Bridge it practice"); document.body.appendChild(o); }
    document.documentElement.style.overflow="hidden"; draw(); };
  document.addEventListener("keydown",e=>{ if(e.key==="Escape" && document.getElementById("brp")) close(); });
})();
